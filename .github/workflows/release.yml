
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force version bump (patch/minor/major)'
        type: choice
        options: [patch, minor, major]
      target_version:
        description: 'Exact version to release (e.g. 1.0.0). Overrides bump logic.'
        type: string
        required: false
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  # A release-preparation branch is only valid for the base commit it was
  # generated from. When new commits land on main before that branch merges,
  # the next release run regenerates the same version from a newer base and the
  # reusable workflow's `git push origin HEAD:release/vX` is rejected as a
  # non-fast-forward. Retire diverged preparation branches (and their PRs) so
  # the release job can recreate them from the current base.
  reconcile-release-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Retire diverged release-preparation branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Tag build; release-preparation branches are untouched."
            exit 0
          fi

          BRANCHES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | grep -E '^release/v[0-9]' || true)

          if [ -z "$BRANCHES" ]; then
            echo "No release-preparation branches present."
            exit 0
          fi

          for BRANCH in $BRANCHES; do
            ENCODED_BRANCH=$(jq -rn --arg branch "$BRANCH" '$branch | @uri')
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${ENCODED_BRANCH}" --jq '.status')
            case "$STATUS" in
              identical|behind)
                echo "$BRANCH is contained in $BASE_SHA; keeping it."
                continue
                ;;
            esac

            echo "$BRANCH is $STATUS relative to $BASE_SHA; retiring it."
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
            if [ -n "$PR" ]; then
              gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          done

  release:
    needs: reconcile-release-branches
    uses: plures/.github/.github/workflows/release-reusable.yml@main
    with:
      bump: ${{ inputs.bump || '' }}
      target_version: ${{ inputs.target_version || '' }}
      publish_npm: false
      # release-reusable.yml evaluates parity after it computes the actual
      # release version. Static opt-in keeps that single authority intact.
      build_development_candidates: true
      frontend_install: npm ci
      tauri_script: npx tauri
    secrets: inherit
